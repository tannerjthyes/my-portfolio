            <button id="mobile-menu-btn" aria-expanded="false" aria-label="Toggle navigation menu" class="md:hidden p-2 -mr-2 text-gray-300 hover:text-white focus:outline-none cursor-pointer">

        <div id="mobile-menu" class="hidden md:hidden frosted-nav border-t border-white/10">
            <div class="flex flex-col px-6 py-5 space-y-3 text-center text-base">
                <a href="index.html" class="py-2 rounded-xl text-gray-300 hover:text-white">Overview</a>
                <a href="resume.html" class="py-2 rounded-xl text-gray-300 hover:text-white">Resume</a>
                <a href="projects/index.html" class="py-2 rounded-xl text-gray-300 hover:text-white">Projects</a>
                <a href="blog/index.html" class="py-2 rounded-xl bg-white/10 text-white font-semibold">Journal</a>

    <main class="min-h-screen px-6 pt-32 pb-16">
        <article class="max-w-3xl mx-auto apple-card p-8 md:p-12 reveal-up">
            <a href="blog/index.html" class="inline-flex items-center text-sm text-[#86868b] hover:text-white transition-colors mb-8">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Journal
            </a>
            <p id="post-category" class="text-xs font-semibold text-blue-400 uppercase tracking-wider mb-4"></p>
            <h1 id="post-title" class="text-4xl md:text-5xl font-bold tracking-tight mb-8"></h1>
            <div id="post-content" class="text-lg md:text-xl leading-relaxed text-[#d2d2d7] space-y-6"></div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800/50 py-12 px-6">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center text-sm text-[#86868b]">
            <p class="mb-4 md:mb-0">&copy; 2026 Tanner Thyes. All rights reserved.</p>
            <div class="flex space-x-6">
                <a href="https://github.com/tannerjthyes" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">GitHub</a>
                <a href="#" class="hover:text-white transition-colors">LinkedIn</a>
                <a href="#" class="hover:text-white transition-colors">Twitter / X</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        const ARTICLE_CONTENT = {
            'aws-lambda': {
                category: 'Cloud Engineering',
                title: 'Mastering AWS S3 & Lambda Deployments',
                paragraphs: [
                    'Production-ready serverless systems start with clear boundaries. S3 handles durable object storage, while Lambda focuses on event-driven processing with narrowly scoped responsibilities.',
                    'I design deployments around repeatable infrastructure as code, least-privilege IAM policies, and environment-specific configuration to keep release workflows safe and predictable.',
                    'Observability is the final step: structured logs, dead-letter queues, and alerting make incident response faster while preserving the speed advantage of serverless development.'
                ]
            },
            'solo-travel': {
                category: 'Life & Travel',
                title: 'From Chiang Mai to Athens: How Solo Travel Shaped My Engineering Mindset',
                paragraphs: [
                    'Solo travel teaches resourcefulness in unfamiliar systems—exactly the same mindset required when debugging distributed infrastructure.',
                    'Each city brought different constraints, from connectivity to language barriers. Adapting quickly became a practice in prioritization and risk management.',
                    'That perspective now informs how I build software: reduce assumptions, design for resilience, and stay curious when the path forward is unclear.'
                ]
            },
            'hyprland-neovim': {
                category: 'Workspace Setup',
                title: 'Building the Perfect Hyprland & Neovim Workspace',
                paragraphs: [
                    'A focused development environment removes friction. Hyprland gives me fast, keyboard-first window management while Neovim keeps editing speed and control high.',
                    'I optimize around consistency: shared keymaps, terminal-native tools, and lightweight automation for repetitive tasks.',
                    'The goal is simple: shorten feedback loops so building, testing, and iterating feel effortless.'
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const postKey = params.get('post');
        const customTitle = params.get('title');
        const customCategory = params.get('category');

        const selectedPost = ARTICLE_CONTENT[postKey] || {
            category: customCategory || 'Blog',
            title: customTitle || 'Article',
            paragraphs: [
                'Thanks for reading this post. Full article content can be added by linking to an external URL or by creating a dedicated article entry.'
            ]
        };

        document.getElementById('post-category').textContent = selectedPost.category;
        document.getElementById('post-title').textContent = selectedPost.title;

        const contentContainer = document.getElementById('post-content');
        selectedPost.paragraphs.forEach((paragraph) => {
            const element = document.createElement('p');
            element.textContent = paragraph;
            contentContainer.appendChild(element);
        });
    </script>
</body>
</html>
